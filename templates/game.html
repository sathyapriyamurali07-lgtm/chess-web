<!DOCTYPE html>
<html>
<head>
    <title>Game</title>
    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
</head>
<body>
    <h2>Room: {{ room }}</h2>
    <div id="board"></div>

<script>
const socket = io();
const room = "{{ room }}";

socket.emit("join", {room: room});

socket.on("state", function(fen){
    console.log("Board:", fen);
});

socket.on("game_over", function(result){
    alert("Game Over: " + result);
});
</script>
</body>
</html>
