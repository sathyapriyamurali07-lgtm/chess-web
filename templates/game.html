<!DOCTYPE html>
<html>
<head>
    <title>Online Chess</title>

    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
    <link rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"/>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <style>
        body { display: flex; gap: 40px; font-family: Arial; }
        #board { width: 400px; }
        #moves { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
        button { margin-top: 10px; }
    </style>
</head>

<body>

<div>
    <h2>Room: {{ room }}</h2>
    <h3 id="turn">Turn: White</h3>
    <h3>White: <span id="whiteTimer">5:00</span></h3>
    <h3>Black: <span id="blackTimer">5:00</span></h3>
    <div id="board"></div>
    <button id="rematchBtn" onclick="rematch()" style="display:none;">🔁 Rematch</button>
</div>

<div>
    <h3>Move History</h3>
    <div id="moves"></div>
    <button onclick="prevMove()">⬅</button>
    <button onclick="nextMove()">➡</button>
</div>

<audio id="moveSound" src="https://www.soundjay.com/chess/move.wav"></audio>
<audio id="checkSound" src="https://www.soundjay.com/chess/check.wav"></audio>
<audio id="gameOverSound" src="https://www.soundjay.com/chess/game-over.wav"></audio>

<script>
const socket = io();
const room = "{{ room }}";

let moveList = [];
let reviewIndex = -1;
let currentTurn = "white";
let whiteTime = 300;
let blackTime = 300;
let timerInterval;

const board = Chessboard('board', {
    draggable: true,
    position: 'start',
    pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png',
    onDrop: function(source, target) {
        socket.emit("move", { room: room, move: source + target });
    }
});

socket.emit("join", {room: room});

socket.on("state", function(data){
    board.position(data.fen);

    if(data.move){
        document.getElementById("moves").innerHTML += data.move + "<br>";
        moveList.push(data.fen);
        reviewIndex = moveList.length - 1;
        document.getElementById("moveSound").play();
    }

    currentTurn = data.turn;
    document.getElementById("turn").innerText = "Turn: " + currentTurn;
});

socket.on("check", function(){
    document.getElementById("checkSound").play();
});

socket.on("game_over", function(data){
    clearInterval(timerInterval);
    document.getElementById("gameOverSound").play();
    alert("Game Over: " + data.result + " (" + data.reason + ")");
    document.getElementById("rematchBtn").style.display = "block";
});

function prevMove(){
    if(reviewIndex > 0){
        reviewIndex--;
        board.position(moveList[reviewIndex]);
    }
}

function nextMove(){
    if(reviewIndex < moveList.length - 1){
        reviewIndex++;
        board.position(moveList[reviewIndex]);
    }
}

function rematch(){
    socket.emit("rematch", {room: room});
    document.getElementById("moves").innerHTML = "";
    moveList = [];
    reviewIndex = -1;
    document.getElementById("rematchBtn").style.display = "none";
}
</script>

</body>
</html>
